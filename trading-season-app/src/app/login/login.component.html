<div class="login-container">
  <div class="login-panel">
    <div hlmCard class="w-full max-w-sm">
      <div hlmCardHeader>
        <h3 hlmCardTitle class="text-2xl">Log in</h3>
        <p hlmCardDescription>Welcome back to TradingSeason</p>
      </div>

      <div hlmCardContent>
        <form (ngSubmit)="onSubmit()" #loginForm="ngForm" hlmFieldGroup>
          <div hlmField>
            <label hlmFieldLabel for="username">Username</label>
            <input
              hlmInput
              id="username"
              type="text"
              class="w-full"
              [(ngModel)]="username"
              name="username"
              placeholder=""
            />
          </div>

          <div hlmField>
            <label hlmFieldLabel for="password">Password</label>
            <input
              hlmInput
              id="password"
              type="password"
              class="w-full"
              [(ngModel)]="password"
              name="password"
              placeholder=""
            />
          </div>

          <button hlmBtn type="submit" class="w-full">Submit</button>
        </form>
      </div>

      <div hlmCardFooter class="justify-center">
        <a routerLink="/register" class="create-account-link">Create an account</a>
      </div>
    </div>
  </div>

  <div class="branding-panel">
    <h2 class="branding-title">TradingSeason</h2>
  </div>
</div>
