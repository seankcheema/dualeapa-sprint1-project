services:
  app:
    build: .
    # No ports: mapping — the app service is intentionally unreachable from the
    # host. `host.docker.internal` is Docker Desktop's DNS name for the host
    # machine; plain "localhost" here would resolve to this container itself,
    # not the Postgres server running natively on the host.
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://host.docker.internal:5432/paysprint
      SPRING_DATASOURCE_USERNAME: paysprint
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-changeme}
    extra_hosts:
      - "host.docker.internal:host-gateway"
